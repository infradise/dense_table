name: dense_table
description: Zero-dependency virtualized data table and editable grid for Flutter. Renders 100,000+ rows with inline cell editing, RowSpan, sorting, resizing, and selection.
version: 1.5.0
homepage: https://github.com/infradise/dense_table
repository: https://github.com/infradise/dense_table
issue_tracker: https://github.com/infradise/dense_table/issues
topics:
  - data-table
  - datagrid
  - table
  - virtualization
  - grid

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
